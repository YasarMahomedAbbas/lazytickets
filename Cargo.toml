[package]
name = "lazytickets"
version = "0.1.0"
edition = "2024"
description = "A lazygit-style terminal UI for GitHub Projects v2 boards that drives Claude Code to start work on tickets."
authors = ["Yasar Mahomed Abbas <yasar.tm44@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/YasarMahomedAbbas/lazytickets"
homepage = "https://github.com/YasarMahomedAbbas/lazytickets"
readme = "README.md"
keywords = ["tui", "github", "projects", "tmux", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
# Smaller, faster-to-download release binaries for the prebuilt artifacts.
lto = "thin"
strip = true

[dependencies]
anyhow = "1.0.103"
directories = "6.0.0"
fuzzy-matcher = "0.3.7"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
toml = "1.1.3"
unicode-width = "0.2.2"
# Inline image rendering in the detail pane (Kitty/sixel/iterm2, half-block fallback).
# Default features pull in libchafa (a system lib) — disable them and bring only the
# crossterm backend + the image formats GitHub attachments actually use.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = "2"
